server:
  port: 8088
spring:
  application:
    name: dashboard-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

services:
  patient: ${PATIENT_SERVICE_URL:http://localhost:8082}
  appointment: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
  clinical: ${CLINICAL_SERVICE_URL:http://localhost:8084}
  finance: ${FINANCE_SERVICE_URL:http://localhost:8085}
  lab: ${LAB_SERVICE_URL:http://localhost:8086}
  operations: ${OPERATIONS_SERVICE_URL:http://localhost:8087}
  content: ${CONTENT_SERVICE_URL:http://localhost:8089}
  inventory: ${INVENTORY_SERVICE_URL:http://localhost:8091}
  encounter: ${ENCOUNTER_SERVICE_URL:http://localhost:8092}
  survey: ${SURVEY_SERVICE_URL:http://localhost:8093}
