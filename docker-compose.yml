      DB_USER: encounter_user
      DB_PASSWORD: ${ENCOUNTER_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
    depends_on:
      eureka-server:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      survey-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
    - 8092:8092
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8092/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
  survey-service:
    image: clinica-cardenas-local-survey-service:latest
    pull_policy: never
    container_name: clinica-survey-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      SPRING_PROFILES_ACTIVE: mysql
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima -Xms64m -Xmx320m -XX:TieredStopAtLevel=1
      DB_URL: jdbc:mysql://mysql:3306/survey_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: survey_user
      DB_PASSWORD: ${SURVEY_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
    - 8093:8093
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8093/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
volumes:
  mysql-data: null
  clinical-documents: null
