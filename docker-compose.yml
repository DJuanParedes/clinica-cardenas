# Clínica Dental Cárdenas · versión completa (todas las historias de usuario)
# Uso:  docker compose up -d --build      →  http://localhost:9081
# Usa otros puertos y otro nombre de proyecto que el Sprint 1 (8081), así ambas versiones pueden correr a la vez.
name: clinica-cardenas-completo

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica
      MYSQL_USER: clinica
      MYSQL_PASSWORD: ${DB_PASSWORD:-clinica}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-clinica}
      TZ: America/Lima
    # Ajustes para bajo consumo de memoria (~180 MB en lugar de ~450 MB)
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=40
      - --table-open-cache=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3308:3306"   # acceso desde DBeaver/Workbench: localhost:3308
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uclinica -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 384m

  # API simulada de SUNAT: servicio SOAP billService (sendBill / getStatusCdr) y consulta RUC.
  # Panel con los comprobantes recibidos: http://localhost:9082
  sunat-sim:
    build: ./sunat-sim
    restart: unless-stopped
    environment:
      SUNAT_USUARIO: ${SUNAT_USUARIO:-MODDATOS}
      SUNAT_CLAVE: ${SUNAT_CLAVE:-MODDATOS}
      TZ: America/Lima
    volumes:
      - sunat-data:/data
    ports:
      - "9082:8090"
    mem_limit: 64m

  # Microservicio de notificaciones por WhatsApp y correo (HU-23 / HU-24). Panel: http://localhost:9083
  notificaciones:
    build: ./notificaciones
    restart: unless-stopped
    environment:
      WEBHOOK_URL: http://backend:8080/api/internal/notifications/callback
      WEBHOOK_TOKEN: ${NOTIF_WEBHOOK_TOKEN:-token-webhook-clinica-cardenas}
      TZ: America/Lima
      # Envío real (ver README → "Mensajes reales"). Sin credenciales, el canal queda en modo de prueba.
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_API_VERSION: ${WA_API_VERSION:-v21.0}
      WA_PLANTILLA: ${WA_PLANTILLA:-}
      WA_PLANTILLA_IDIOMA: ${WA_PLANTILLA_IDIOMA:-es}
      WA_MODO: ${WA_MODO:-}
      WA_WABA_ID: ${WA_WABA_ID:-}
      WA_NUMEROS_PERMITIDOS: ${WA_NUMEROS_PERMITIDOS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
      SMTP_NOMBRE: ${SMTP_NOMBRE:-Clínica Dental Cárdenas}
      CORREOS_PERMITIDOS: ${CORREOS_PERMITIDOS:-}
      ENVIAR_A_TODOS: ${ENVIAR_A_TODOS:-false}
      DESTINOS_REALES: ${DESTINOS_REALES:-}
    volumes:
      - notif-data:/data
    ports:
      - "9083:8093"
    mem_limit: 128m

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      sunat-sim:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/clinica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
      DB_USER: clinica
      DB_PASSWORD: ${DB_PASSWORD:-clinica}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-clinica-cardenas-2026}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-true}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-Clinica2026}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      EMPRESA_RUC: ${EMPRESA_RUC:-10102984841}
      EMPRESA_RAZON_SOCIAL: ${EMPRESA_RAZON_SOCIAL:-CLÍNICA DENTAL CÁRDENAS}
      SUNAT_MODE: ${SUNAT_MODE:-soap}
      SUNAT_URL: http://sunat-sim:8090/ol-ti-itcpfegem-beta/billService
      SUNAT_CONSULTA_URL: http://sunat-sim:8090/v1/ruc
      SUNAT_USUARIO: ${SUNAT_USUARIO:-MODDATOS}
      SUNAT_CLAVE: ${SUNAT_CLAVE:-MODDATOS}
      NOTIF_URL: http://notificaciones:8093
      NOTIF_PANEL_URL: http://localhost:9083
      NOTIF_WEBHOOK_TOKEN: ${NOTIF_WEBHOOK_TOKEN:-token-webhook-clinica-cardenas}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    mem_limit: 384m

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9081:80"
    volumes:
      # Pruebas end-to-end ejecutables desde la consola del navegador (ver README)
      - ./pruebas:/usr/share/nginx/html/pruebas:ro
    mem_limit: 64m

volumes:
  db-data:
  sunat-data:
  notif-data:
