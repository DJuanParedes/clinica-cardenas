name: clinica-cardenas-local
services:
  mysql:
    image: mysql:8.4
    container_name: clinica-mysql
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    - --innodb-buffer-pool-size=256M
    - --max-connections=120
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      ENCOUNTER_DB_PASSWORD: ${ENCOUNTER_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      SURVEY_DB_PASSWORD: ${SURVEY_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
    ports:
    - 3307:3306
    volumes:
    - mysql-data:/var/lib/mysql
    - ./database/mysql/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 35s
    restart: unless-stopped
    mem_limit: 640m
  eureka-server:
    image: clinica-cardenas-local-eureka-server:latest
    pull_policy: never
    container_name: clinica-eureka-server
    ports:
    - 8761:8761
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8761/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima -Xms64m -Xmx320m -XX:TieredStopAtLevel=1
  auth-service:
    image: clinica-cardenas-local-auth-service:latest
    pull_policy: never
    container_name: clinica-auth-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      SPRING_PROFILES_ACTIVE: mysql,local
      LOCAL_OTP_CODE: ${LOCAL_OTP_CODE:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      OTP_PROVIDER: ${OTP_PROVIDER:-local}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_OTP_TTL_MINUTES: ${MAIL_OTP_TTL_MINUTES:-10}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?Configura el superadministrador en .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Configura el superadministrador en .env}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:?Configura el superadministrador en .env}
      BOOTSTRAP_ADMIN_RECOVERY_CHANNEL: ${BOOTSTRAP_ADMIN_RECOVERY_CHANNEL:?Configura el superadministrador en .env}
      APPOINTMENT_SERVICE_URL: http://appointment-service:8083
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima -Xms64m -Xmx320m -XX:TieredStopAtLevel=1
      DB_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
    - 8081:8081
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8081/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
  patient-service:
    image: clinica-cardenas-local-patient-service:latest
    pull_policy: never
    container_name: clinica-patient-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
      SPRING_PROFILES_ACTIVE: mysql
      ENCOUNTER_SERVICE_URL: http://encounter-service:8092
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima -Xms64m -Xmx320m -XX:TieredStopAtLevel=1
      DB_URL: jdbc:mysql://mysql:3306/patient_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: patient_user
      DB_PASSWORD: ${PATIENT_DB_PASSWORD:?Ejecuta PREPARAR-ENTORNO-LOCAL.bat}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
