map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# En producción el frontend solo recibe tráfico desde Caddy; en local puede
# recibirlo directamente. Esta variable toma la IP original reenviada o, si
# no existe, la IP de conexión directa.
map $http_x_forwarded_for $client_rate_key {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

# Segunda barrera además de los bloqueos por cuenta en auth-service.
limit_req_zone $client_rate_key zone=auth_limit:10m rate=5r/s;
limit_req_zone $client_rate_key zone=reset_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El backend acepta hasta 25 MB por importación XLSX; dejamos un margen
    # pequeño para multipart sin permitir cargas arbitrariamente grandes.
    client_max_body_size 30m;


    # Recuperación de contraseña: límite estricto por IP. El backend aplica
    # además ventana por cuenta, respuesta genérica y bloqueo por códigos erróneos.
    location = /api/auth/password-reset/request {
        limit_req zone=reset_limit burst=2 nodelay;
        proxy_pass http://api-gateway:8090/api/auth/password-reset/request;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://api-gateway:8090/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://api-gateway:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
