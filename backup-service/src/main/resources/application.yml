server:
  port: 8094
spring:
  application:
    name: backup-service
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
backup:
  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    pacientes: ${PATIENT_SERVICE_URL:http://localhost:8082}
    agenda: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
    clinica: ${CLINICAL_SERVICE_URL:http://localhost:8084}
    finanzas: ${FINANCE_SERVICE_URL:http://localhost:8085}
    laboratorio: ${LAB_SERVICE_URL:http://localhost:8086}
    operaciones: ${OPERATIONS_SERVICE_URL:http://localhost:8087}
    contenido: ${CONTENT_SERVICE_URL:http://localhost:8089}
    inventario: ${INVENTORY_SERVICE_URL:http://localhost:8091}
    atenciones: ${ENCOUNTER_SERVICE_URL:http://localhost:8092}
    encuestas: ${SURVEY_SERVICE_URL:http://localhost:8093}
    dashboard: ${DASHBOARD_SERVICE_URL:http://localhost:8088}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
