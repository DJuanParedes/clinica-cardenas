# Ajustes para el servidor en la nube (Oracle Cloud). Se usa junto con el docker-compose.yml principal:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.nube.yml up -d --build
# - Solo la web queda pública, por HTTPS (Caddy obtiene el certificado de Let's Encrypt solo).
# - La base de datos y el panel de notificaciones no se publican a internet. Los paneles de los simuladores se ven en
#   https://DOMINIO/whatsapp-sim/ y https://DOMINIO/sunat-sim/ con usuario y contraseña del personal.
services:
  db:
    ports: !reset []
  sunat-sim:
    ports: !override
      - "127.0.0.1:9082:8090"
    environment:
      # En internet el panel (https://DOMINIO/sunat-sim/) pide usuario y contraseña del personal.
      AUTH_URL: http://backend:8080/api/auth/login
  notificaciones:
    ports: !override
      - "127.0.0.1:9083:8093"
  # Simulador de WhatsApp: el puerto 9084 solo en el propio servidor; desde internet, por https://DOMINIO/whatsapp-sim/
  whatsapp-sim:
    ports: !override
      - "127.0.0.1:9084:8094"
    environment:
      # En internet el panel (https://DOMINIO/whatsapp-sim/) pide usuario y contraseña del personal.
      AUTH_URL: http://backend:8080/api/auth/login
  backend:
    environment:
      NOTIF_PANEL_URL: ""
      APP_PUBLIC_URL: https://${DOMINIO}
  frontend:
    ports: !reset []
    volumes: !reset []
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

volumes:
  caddy-data:
  caddy-config:
