name: Validación del repositorio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-safety:
    name: Archivos seguros y Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Impedir secretos y datos operativos rastreados
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files \
            | grep -vE '(^|/)\.env(\.production)?\.example$' \
            | grep -E '(^|/)(\.env($|\.)|node_modules/|target/|data/|backups?/|logs?/)|\.(log|jar|war|class|db|sqlite3?|dump|pem|key|p12|pfx|jks)$'; then
            echo "Se encontró un archivo sensible o generado en Git."
            exit 1
          fi

      - name: Validar Compose de producción con marcadores
        run: docker compose --env-file .env.production.example -f docker-compose.production-secure.yml config --quiet

  backend:
    name: Backend Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Validar y compilar
        run: npm test
