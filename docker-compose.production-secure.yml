      LAB_SERVICE_URL: http://lab-service:8086
      APPOINTMENT_SERVICE_URL: http://appointment-service:8083
      DB_URL: jdbc:mysql://mysql:3306/finance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: finance_user
      DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Configure FINANCE_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
