name: clinica-cardenas-prod
services:
  mysql:
    image: mysql:8.4
    container_name: clinica-mysql
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    - --innodb-buffer-pool-size=512M
    - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Configure AUTH_DB_PASSWORD}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD:?Configure PATIENT_DB_PASSWORD}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?Configure APPOINTMENT_DB_PASSWORD}
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD:?Configure CLINICAL_DB_PASSWORD}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Configure FINANCE_DB_PASSWORD}
      LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:?Configure LAB_DB_PASSWORD}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:?Configure OPERATIONS_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Configure INVENTORY_DB_PASSWORD}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?Configure CONTENT_DB_PASSWORD}
      ENCOUNTER_DB_PASSWORD: ${ENCOUNTER_DB_PASSWORD:?Configure ENCOUNTER_DB_PASSWORD}
      SURVEY_DB_PASSWORD: ${SURVEY_DB_PASSWORD:?Configure SURVEY_DB_PASSWORD}
    volumes:
    - mysql-data:/var/lib/mysql
    - ./database/mysql/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped
    networks:
    - db
  eureka-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: eureka-server
    container_name: clinica-eureka-server
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8761/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    environment: {}
    networks:
    - app
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: auth-service
    container_name: clinica-auth-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      SPRING_PROFILES_ACTIVE: mysql
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?Configure BOOTSTRAP_ADMIN_NAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Configure BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:?Configure BOOTSTRAP_ADMIN_PHONE}
      BOOTSTRAP_ADMIN_RECOVERY_CHANNEL: ${BOOTSTRAP_ADMIN_RECOVERY_CHANNEL:?Configure BOOTSTRAP_ADMIN_RECOVERY_CHANNEL}
      OTP_PROVIDER: ${OTP_PROVIDER:?Configure OTP_PROVIDER}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_OTP_TTL_MINUTES: ${MAIL_OTP_TTL_MINUTES:-10}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      APPOINTMENT_SERVICE_URL: http://appointment-service:8083
      DB_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Configure AUTH_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8081/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks:
    - app
    - db
  patient-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: patient-service
    container_name: clinica-patient-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      SPRING_PROFILES_ACTIVE: mysql
      ENCOUNTER_SERVICE_URL: http://encounter-service:8092
      DB_URL: jdbc:mysql://mysql:3306/patient_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: patient_user
      DB_PASSWORD: ${PATIENT_DB_PASSWORD:?Configure PATIENT_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8082/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks:
    - app
    - db
  appointment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: appointment-service
    container_name: clinica-appointment-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      SPRING_PROFILES_ACTIVE: mysql
      ENCOUNTER_SERVICE_URL: http://encounter-service:8092
      DB_URL: jdbc:mysql://mysql:3306/appointment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: appointment_user
      DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?Configure APPOINTMENT_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8083/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks:
    - app
    - db
  clinical-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: clinical-service
    container_name: clinica-clinical-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      SPRING_PROFILES_ACTIVE: mysql
      DOCUMENT_STORAGE_PATH: /app/storage
      DB_URL: jdbc:mysql://mysql:3306/clinical_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: clinical_user
      DB_PASSWORD: ${CLINICAL_DB_PASSWORD:?Configure CLINICAL_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
    - clinical-documents:/app/storage
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8084/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    networks:
    - app
    - db
  finance-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
